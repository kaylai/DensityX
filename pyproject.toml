[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DensityX"
version = "2.0.0"
description = "Python library that calcualtes the density of a silicate melt given major oxide composition, pressure, and temperature. Based on calculations from Iacovino and Till (2019)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

authors = [
    { name = "Kayla Iacovino", email = "kaylaiacovino@protonmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pandas-stubs",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.urls]
Homepage = "https://github.com/kaylai/DensityX"
Repository = "https://github.com/kaylai/DensityX"
